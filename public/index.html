<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO · AEO · GEO Audit</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e8eaf0;--mute:#8b93a7;--pass:#34d399;--warn:#fbbf24;--fail:#f87171;--accent:#7c9cff}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--panel:#fff;--line:#e3e6ee;--text:#151821;--mute:#5d667c;--accent:#3b5bdb}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:900px;margin:0 auto;padding:40px 16px 80px}
  h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--mute);margin:0 0 24px}
  form{display:flex;gap:8px}
  input{flex:1;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
  button{cursor:pointer;border:0;border-radius:10px;padding:0 22px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
  button:disabled{opacity:.6;cursor:wait}
  .err{margin-top:14px;color:var(--fail)}
  #report{display:none;margin-top:32px}
  .meta{color:var(--mute);font-size:13px;word-break:break-all;margin-bottom:16px}
  .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  .score{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .score b{display:block;font-size:34px;line-height:1.1}
  .score span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{background:none;color:var(--mute);padding:10px 16px;border-radius:8px 8px 0 0;border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .item{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
  .item.pass{border-left-color:var(--pass)}.item.warn{border-left-color:var(--warn)}.item.fail{border-left-color:var(--fail)}
  .item h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
  .badge{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .pass .badge{color:var(--pass)}.warn .badge{color:var(--warn)}.fail .badge{color:var(--fail)}
  .item p{margin:4px 0;color:var(--mute)}
  .fix{color:var(--text)!important}
  .code{position:relative;margin-top:8px}
  pre{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:auto;font-size:12.5px;max-height:260px}
  .copy{position:absolute;top:6px;right:6px;padding:4px 10px;font-size:12px;background:var(--line);color:var(--text)}
  .actions{margin-top:20px;display:flex;gap:8px}
  .actions button{padding:10px 16px;background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .note{color:var(--mute);font-size:12px;margin-top:14px}
  @media (max-width:600px){.scores{grid-template-columns:repeat(2,1fr)}form{flex-direction:column}button{padding:12px}}
  @media print{.tabs,form,.actions,.copy{display:none}.panelwrap>div{display:block!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main>
  <h1>SEO · AEO · GEO Audit</h1>
  <p class="sub">Paste a URL. Get a three-part report with fixes you can copy straight into your site.</p>
  <form id="f">
    <input id="u" placeholder="example.com or https://example.com/page" autocomplete="off" required>
    <button id="go">Run audit</button>
  </form>
  <div class="err" id="err"></div>

  <section id="report">
    <div class="meta" id="meta"></div>
    <div class="scores" id="scores"></div>
    <div class="tabs" id="tabs"></div>
    <div class="panelwrap" id="panels"></div>
    <div class="actions">
      <button id="dl">Download JSON</button>
      <button id="pr">Print / Save PDF</button>
    </div>
    <p class="note" id="note"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const LABELS = {seo:"SEO", aeo:"AEO", geo:"GEO"};
const SUB = {seo:"Search engines", aeo:"Answer engines", geo:"Generative engines"};
let data = null;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function color(n){return n>=80?"var(--pass)":n>=50?"var(--warn)":"var(--fail)"}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Auditing…";
  try {
    const r = await fetch("/api/audit", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url:$("u").value})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Audit failed");
    data = j; render(j);
  } catch (x) { $("err").textContent = x.message; $("report").style.display = "none"; }
  $("go").disabled = false; $("go").textContent = "Run audit";
});

function render(d){
  $("report").style.display = "block";
  $("meta").textContent = d.url + (d.title ? " — " + d.title : "");
  const s = d.scores;
  $("scores").innerHTML = [["overall","Overall"],["seo","SEO"],["aeo","AEO"],["geo","GEO"]].map(([k,l]) =>
    `<div class="score"><b style="color:${color(s[k])}">${s[k]}</b><span>${l}</span></div>`).join("");
  $("tabs").innerHTML = ["seo","aeo","geo"].map((k,i)=>`<button class="tab ${i?"":"on"}" data-k="${k}">${LABELS[k]} · ${SUB[k]}</button>`).join("");
  $("panels").innerHTML = ["seo","aeo","geo"].map((k,i)=>{
    const order = {fail:0,warn:1,pass:2};
    const items = d.checks.filter(c=>c.pillar===k).sort((a,b)=>order[a.status]-order[b.status]||b.weight-a.weight);
    return `<div data-p="${k}" style="display:${i?"none":"block"}">${items.map(item).join("")}</div>`;
  }).join("");
  $("note").textContent = d.notes + ` ${d.summary.pass} passed, ${d.summary.warn} warnings, ${d.summary.fail} failed.`;
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
    document.querySelectorAll("[data-p]").forEach(p=>p.style.display=p.dataset.p===t.dataset.k?"block":"none");
  });
  document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
    navigator.clipboard.writeText(b.nextElementSibling.textContent); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200);
  });
  $("report").scrollIntoView({behavior:"smooth"});
}

function item(c){
  return `<div class="item ${c.status}">
    <h3><span>${esc(c.title)}</span><span class="badge">${c.status}</span></h3>
    <p>${esc(c.detail)}</p>
    ${c.solution ? `<p class="fix"><b>Fix:</b> ${esc(c.solution)}</p>` : ""}
    ${c.code ? `<div class="code"><button class="copy">Copy</button><pre>${esc(c.code)}</pre></div>` : ""}
  </div>`;
}

$("dl").onclick = () => {
  if (!data) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download = "audit-report.json"; a.click();
};
$("pr").onclick = () => window.print();
</script>
</body>
</html>
